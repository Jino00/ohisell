# 신설 2026-08-07 — 그전까지 이 repo엔 CI가 없었고 모든 PR이 "no checks reported"였다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 푸시가 오면 돌던 실행을 취소한다. 병행 세션이 활발한 repo라
# 이게 없으면 옛 커밋 결과가 뒤늦게 도착해 "어느 게 지금 상태인지" 헷갈린다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 한쪽 버전이 깨져도 다른 쪽 결과를 끝까지 본다
      matrix:
        # ★3.10 = prod 실측(`/home/ubuntu/ohisell/backend/.venv` = Python 3.10.12).
        #   3.14 = 개발 Mac. 둘이 갈라져 있어 한쪽만 돌리면 나머지 쪽 파손을 못 본다
        #   (교훈 #1: Python 3.14에서 SQLAlchemy 호환성이 실제로 깨진 전례가 있다).
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest
        working-directory: backend # rootdir가 backend여야 tests/ 의 로컬 임포트가 풀린다
        # ★반드시 `python -m pytest`다. `pytest`(콘솔 스크립트)는 CWD를 sys.path에 넣지 않아
        #   `import app`이 전부 죽는다(첫 CI 실행 실측: 227 collection errors,
        #   `ModuleNotFoundError: No module named 'app'`). 이 repo엔 conftest.py도
        #   pyproject/pytest.ini도 없어서 경로를 잡아 줄 것이 `-m`뿐이다.
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: typecheck
        working-directory: frontend
        run: npx tsc -b
      # ★래칫: error는 0이어야 하고, warning은 **늘어나면** 실패한다.
      #   부채를 0으로 만들 때까지 CI를 미루면 그동안 새 위반이 계속 들어온다 —
      #   총량을 고정해 두면 "지금부터 안 는다"가 오늘 보장된다.
      #   ⚠️부채를 갚아 숫자가 줄면 이 값도 같이 내릴 것(안 내리면 래칫이 헐거워진다).
      #
      # ── 재기준선 이력 ──────────────────────────────────────────────────────
      # 2026-08-07  54  최초 실측.
      # 2026-08-24  96  ★**래칫이 헐거워진 게 아니라, 래칫이 «꺼져 있던» 기간의 유입을 잠근다.**
      #   2026-08-10~08-24 CI가 Actions 결제 차단(무료 2,000분 소진 + 계정 예산 $0)으로
      #   전 잡이 0스텝 실패했다 — 이 래칫이 도는 날이 하루도 없었다. 그 사이 54→96.
      #   실측 분해(2026-08-24, `eslint . -f json`): 96 warnings / 0 errors / 23파일.
      #     react-refresh/only-export-components 50 (CostPage.tsx 28 — 전부 최근분)
      #     @typescript-eslint/no-explicit-any    36 (30건은 8/10 이전 기존 부채)
      #     react-hooks/set-state-in-effect        8 · react-hooks/exhaustive-deps 2
      #   `--fix-dry-run` 결과 **자동수정 가능 0건** — 전부 구조 변경(파일 분리·타입 명시)이 필요.
      #   ★지금 안 고치는 이유: 최대 덩어리 `CostPage.tsx`(28건)는 «sellc-원가-메뉴» 트랙이
      #     현재 작업 중인 파일이다. 그 트랙이 쪼갤 때 같이 갚고 이 숫자를 내리는 것이 맞다.
      #     이 세션이 지금 손대면 진행 중인 작업과 정면 충돌한다.
      #   ⚠️이 값을 다시 올리려면 위와 같은 «게이트가 꺼져 있었다» 수준의 근거가 있어야 한다.
      - name: lint
        working-directory: frontend
        run: npx eslint . --max-warnings 96
      - name: test
        working-directory: frontend
        run: npm run test
      # ★`tsc -b`만으로는 부족하다 — 2026-08-06에 `tsc --noEmit`은 통과했는데 실제 빌드가
      #   TS2345로 죽은 적이 있다. 배포되는 산출물을 만드는 명령 그 자체를 돌려야 한다.
      - name: build
        working-directory: frontend
        run: npm run build
